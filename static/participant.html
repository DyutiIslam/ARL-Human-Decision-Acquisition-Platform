<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ARL Participant Workstation</title>
  <style>
    :root{--bg:#eaf3f8;--card:#ffffff;--ink:#132033;--muted:#5d6b7a;--blue:#1f6feb;--green:#198754;--red:#c92a2a;--yellow:#fff4cc;--border:#d6dee8;}
    *{box-sizing:border-box}
    body{font-family:Arial, Helvetica, sans-serif; margin:0; background:var(--bg); color:var(--ink); text-align:center;}
    .shell{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:26px;}
    .panel{width:min(1000px,96vw); background:var(--card); border:1px solid var(--border); border-radius:22px; padding:42px; box-shadow:0 8px 28px rgba(16,24,40,.08);}
    .studyTitle{font-size:34px; font-weight:900; margin:0 0 8px;}.lab{font-size:18px; color:var(--muted); margin-bottom:28px;}.phaseTag{display:inline-block; padding:10px 18px; border-radius:999px; background:#edf4ff; color:#164c96; font-size:18px; font-weight:900; letter-spacing:.04em; text-transform:uppercase; margin-bottom:22px;}
    .mainText{font-size:42px; font-weight:900; line-height:1.2; margin:16px 0;}.subText{font-size:24px; line-height:1.45; color:#344054; margin:12px auto; max-width:760px;}.word{font-size:84px; font-weight:900; letter-spacing:4px; margin:18px 0; color:#0b1f3a;}.timer{font-size:64px; font-weight:900; margin:18px 0; color:var(--green)}.timer.warn{color:#b7791f}.timer.expired{color:var(--red)}
    .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:18px; margin-top:26px; text-align:left}.infoCard{border:1px solid var(--border); border-radius:16px; padding:18px; background:#fbfdff}.infoCard h3{margin:0 0 10px; font-size:20px; color:#1f6feb}.infoCard p{font-size:17px; line-height:1.45; margin:0;color:#344054}
    .choices{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin:28px auto; max-width:820px}.choice{background:#f8fbff; border:2px solid var(--border); border-radius:16px; padding:20px; font-size:26px; font-weight:900; cursor:pointer;}.choice input{display:none}.choice:has(input:checked){border-color:var(--blue); background:#dbeafe; color:#0b3b75}.checklist{max-width:700px; margin:20px auto; text-align:left}.checkItem{display:block; border:2px solid var(--border); border-radius:14px; padding:16px 18px; margin:10px 0; background:#f8fbff; font-size:22px; font-weight:700;}.checkItem input{transform:scale(1.3); margin-right:12px}.submit{font-size:24px; padding:18px 34px; border:0; border-radius:14px; background:var(--blue); color:white; font-weight:900; cursor:pointer}.submitted{background:#d1fadf; border:2px solid #12b76a; color:#05603a; padding:20px; border-radius:16px; font-size:28px; font-weight:900; margin-top:20px}.footer{font-size:16px;color:var(--muted); margin-top:24px}.mediaDock{position:fixed;right:14px;bottom:14px;width:280px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);text-align:left;z-index:20}.mediaDock video{width:100%;max-height:150px;background:#111;border-radius:9px}.mediaStatus{font-size:14px;margin-top:7px;color:#344054}.hidden{display:none!important}.complete{background:#f3fff7}.speaking{background:#fff8db}.decision{background:#eaf8ee}.danger{background:#fff0f0}
    @media(max-width:700px){.panel{padding:28px}.studyTitle{font-size:26px}.mainText{font-size:32px}.subText{font-size:20px}.word{font-size:58px}.timer{font-size:48px}}
  </style>
</head>
<body>
<div class="shell"><main class="panel" id="panel"><div id="content">Loading...</div></main></div>
<aside id="mediaDock" class="mediaDock hidden"><b>P1 Camera + Microphone</b><video id="mediaPreview" autoplay muted playsinline></video><label class="mediaStatus">Camera<select id="cameraSelect" style="width:100%;margin-top:4px"></select></label><label class="mediaStatus">Microphone<select id="microphoneSelect" style="width:100%;margin-top:4px"></select></label><div class="mediaStatus"><b>Live microphone level</b><div style="height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:4px"><div id="audioMeter" style="height:100%;width:0%;background:#198754;transition:width .08s linear"></div></div><span id="audioTrackStatus">Audio track: not checked</span></div><div id="mediaStatus" class="mediaStatus">Not configured</div></aside>
<script>
const pathMatch=location.pathname.match(/\/p([1-5])$/);
const params=new URLSearchParams(location.search);
const playerId=pathMatch?parseInt(pathMatch[1],10):parseInt(params.get('player')||'1',10);
let sessionId=params.get('session')||'S001';
let state=null,lastKey='',previousPhase='',phaseStartedAt=Date.now(),submittedKey='',audioCtx=null,audioEnabled=false,lastBeepKey='',audioStatus='Disabled';
let mediaStream=null,recordingStream=null,mediaRecorder=null,audioRecorder=null,mediaChunks=[],audioChunks=[],mediaReady=false,mediaRecording=false,mediaSegment=0,mediaStartedUtc='',mediaMime='video/webm',audioMime='audio/webm',mediaAudioCtx=null,micSource=null,micAnalyser=null,mixDestination=null,meterAnimation=null,selectedCameraId='',selectedMicrophoneId='';
const content=document.getElementById('content'),mediaDock=document.getElementById('mediaDock'),mediaPreview=document.getElementById('mediaPreview'),mediaStatus=document.getElementById('mediaStatus'),cameraSelect=document.getElementById('cameraSelect'),microphoneSelect=document.getElementById('microphoneSelect'),audioMeter=document.getElementById('audioMeter'),audioTrackStatus=document.getElementById('audioTrackStatus');
if(playerId===1)mediaDock.classList.remove('hidden');
async function api(path,options={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...options});if(!r.ok)throw new Error(await r.text());return await r.json();}
function setMediaStatus(text){if(mediaStatus)mediaStatus.textContent=text;}
async function postMediaEvent(event,note=''){try{await api('/api/media/event',{method:'POST',body:JSON.stringify({session_id:sessionId,player_id:playerId,event,segment:mediaSegment,note})});}catch(e){console.warn('Media event failed',e);}}
function enableAudioCue(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();audioEnabled=true;audioStatus='Enabled';longBeep(0.13,0.35);render(true);}catch(e){audioStatus='Unavailable';console.warn('Audio cue unavailable',e);render(true);}}
function longBeep(volume=0.30,duration=0.80){if(!audioEnabled||!audioCtx)return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.frequency.value=1200;osc.type='sine';gain.gain.value=volume;osc.connect(gain);gain.connect(audioCtx.destination);const t=audioCtx.currentTime;osc.start(t);gain.gain.setValueAtTime(volume,t);gain.gain.setValueAtTime(volume,t+Math.max(.05,duration-.08));gain.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.stop(t+duration+.02);}
function testBeep(){enableAudioCue();setTimeout(()=>longBeep(.30,.80),150);}
function maybeBeepForBoundary(changed){if(!changed||!state)return;const isSpeaker=state.phase.startsWith('SPEAKER_P');const key=`${state.session_id}-${state.game_number}-${state.round_number}-${state.phase}`;if(isSpeaker&&state.active_speaker===playerId&&key!==lastBeepKey){lastBeepKey=key;longBeep(.34,.85);if(playerId===1)injectBeepIntoRecording(.34,.85);}}
async function listMediaDevices(){
  const devices=await navigator.mediaDevices.enumerateDevices();
  const cameras=devices.filter(d=>d.kind==='videoinput');
  const microphones=devices.filter(d=>d.kind==='audioinput');
  cameraSelect.innerHTML=cameras.map((d,i)=>`<option value="${d.deviceId}">${d.label||`Camera ${i+1}`}</option>`).join('');
  microphoneSelect.innerHTML=microphones.map((d,i)=>`<option value="${d.deviceId}">${d.label||`Microphone ${i+1}`}</option>`).join('');
  if(selectedCameraId)cameraSelect.value=selectedCameraId;
  if(selectedMicrophoneId)microphoneSelect.value=selectedMicrophoneId;
}
function stopCurrentMedia(){
  if(meterAnimation)cancelAnimationFrame(meterAnimation);
  meterAnimation=null;
  if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());
  if(recordingStream)recordingStream.getTracks().forEach(t=>t.stop());
  mediaStream=null;recordingStream=null;mediaReady=false;
}
function startAudioMeter(){
  if(!micAnalyser)return;
  const data=new Uint8Array(micAnalyser.fftSize);
  const draw=()=>{micAnalyser.getByteTimeDomainData(data);let sum=0;for(const v of data){const x=(v-128)/128;sum+=x*x;}const rms=Math.sqrt(sum/data.length);const pct=Math.min(100,Math.max(1,rms*420));audioMeter.style.width=`${pct}%`;meterAnimation=requestAnimationFrame(draw);};
  draw();
}
async function setupMedia(){
  if(playerId!==1)return;
  try{
    enableAudioCue();
    stopCurrentMedia();
    const videoConstraint=cameraSelect?.value?{deviceId:{exact:cameraSelect.value},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}}:{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}};
    const audioConstraint=microphoneSelect?.value?{deviceId:{exact:microphoneSelect.value},echoCancellation:false,noiseSuppression:false,autoGainControl:false}:{echoCancellation:false,noiseSuppression:false,autoGainControl:false};
    mediaStream=await navigator.mediaDevices.getUserMedia({video:videoConstraint,audio:audioConstraint});
    selectedCameraId=mediaStream.getVideoTracks()[0]?.getSettings().deviceId||'';
    selectedMicrophoneId=mediaStream.getAudioTracks()[0]?.getSettings().deviceId||'';
    await listMediaDevices();
    mediaPreview.srcObject=mediaStream;
    const audioTracks=mediaStream.getAudioTracks();
    const videoTracks=mediaStream.getVideoTracks();
    if(!videoTracks.length)throw new Error('No camera video track was provided.');
    if(!audioTracks.length)throw new Error('No microphone audio track was provided.');
    mediaAudioCtx=mediaAudioCtx||new(window.AudioContext||window.webkitAudioContext)();
    await mediaAudioCtx.resume();
    micSource=mediaAudioCtx.createMediaStreamSource(new MediaStream(audioTracks));
    micAnalyser=mediaAudioCtx.createAnalyser();micAnalyser.fftSize=1024;
    mixDestination=mediaAudioCtx.createMediaStreamDestination();
    micSource.connect(micAnalyser);micSource.connect(mixDestination);
    recordingStream=new MediaStream([...videoTracks,...mixDestination.stream.getAudioTracks()]);
    audioTrackStatus.textContent=`Audio track: ${audioTracks[0].label||'microphone'} ✓`;
    startAudioMeter();
    mediaReady=true;
    const out=await api(`/api/media/status?session_id=${encodeURIComponent(sessionId)}`);
    mediaSegment=Math.max(0,Number(out.status?.['1']?.segment||0));
    setMediaStatus('Ready — video and microphone verified');
    await postMediaEvent('ready',JSON.stringify({camera:videoTracks[0].label,microphone:audioTracks[0].label,audio_tracks:audioTracks.length,video_tracks:videoTracks.length}));
    if(state?.phase==='SESSION_START')await startMediaRecording();
    render(true);
  }catch(e){mediaReady=false;setMediaStatus('Permission/device error: '+e.message);audioTrackStatus.textContent='Audio track: unavailable';await postMediaEvent(e.name==='NotAllowedError'?'permission_denied':'error',e.message);alert('Camera/microphone setup failed: '+e.message);}
}
cameraSelect?.addEventListener('change',()=>{selectedCameraId=cameraSelect.value;setupMedia();});
microphoneSelect?.addEventListener('change',()=>{selectedMicrophoneId=microphoneSelect.value;setupMedia();});
function bestMime(){const choices=['video/webm;codecs=vp8,opus','video/webm;codecs=vp9,opus','video/webm'];return choices.find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported(x))||'';}
function bestAudioMime(){const choices=['audio/webm;codecs=opus','audio/webm'];return choices.find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported(x))||'';}
function injectBeepIntoRecording(volume=.30,duration=.80){
  if(!mediaAudioCtx||!mixDestination)return;
  const osc=mediaAudioCtx.createOscillator(),gain=mediaAudioCtx.createGain();osc.frequency.value=1200;osc.type='sine';gain.gain.value=volume;osc.connect(gain);gain.connect(mixDestination);gain.connect(mediaAudioCtx.destination);const t=mediaAudioCtx.currentTime;osc.start(t);gain.gain.setValueAtTime(volume,t);gain.gain.setValueAtTime(volume,t+Math.max(.05,duration-.08));gain.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.stop(t+duration+.02);
}
async function startMediaRecording(){
  if(playerId!==1||!mediaReady||mediaRecording||!recordingStream)return;
  try{
    const a=recordingStream.getAudioTracks(),v=recordingStream.getVideoTracks();
    if(a.length!==1||v.length<1)throw new Error(`Invalid recording stream: ${v.length} video track(s), ${a.length} audio track(s).`);
    mediaChunks=[];audioChunks=[];mediaSegment+=1;mediaStartedUtc=new Date().toISOString();
    const mime=bestMime();mediaRecorder=new MediaRecorder(recordingStream,mime?{mimeType:mime}:undefined);mediaMime=mediaRecorder.mimeType||'video/webm';
    const amime=bestAudioMime();audioRecorder=new MediaRecorder(new MediaStream(a),amime?{mimeType:amime}:undefined);audioMime=audioRecorder.mimeType||'audio/webm';
    mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)mediaChunks.push(e.data);};
    audioRecorder.ondataavailable=e=>{if(e.data&&e.data.size)audioChunks.push(e.data);};
    mediaRecorder.onstop=()=>uploadMediaSegment('camera_audio',mediaChunks,mediaMime,false);
    audioRecorder.onstop=()=>uploadMediaSegment('audio_only',audioChunks,audioMime,false);
    mediaRecorder.start(1000);audioRecorder.start(1000);mediaRecording=true;
    setMediaStatus(`Recording segment ${mediaSegment} — audio verified`);
    await postMediaEvent('recording_started',JSON.stringify({video_mime:mediaMime,audio_mime:audioMime,audio_tracks:a.length,video_tracks:v.length,microphone:mediaStream.getAudioTracks()[0]?.label||''}));
  }catch(e){setMediaStatus('Recording error: '+e.message);await postMediaEvent('error',e.message);}
}
async function stopMediaRecording(){if(!mediaRecording)return;mediaRecording=false;setMediaStatus('Stopping and saving video + audio…');await postMediaEvent('recording_stopped','Recorder stop requested');if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop();if(audioRecorder&&audioRecorder.state!=='inactive')audioRecorder.stop();}
async function uploadMediaSegment(kind,chunks,mime,useBeacon=false){
  if(!chunks.length){setMediaStatus(`${kind} recording contained no data`);await postMediaEvent('error',`${kind} recording contained no data`);return;}
  const ended=new Date().toISOString(),blob=new Blob(chunks,{type:mime});chunks.length=0;
  const q=new URLSearchParams({session_id:sessionId,player_id:String(playerId),segment:String(mediaSegment),started_utc:mediaStartedUtc,ended_utc:ended,media_kind:kind,camera_label:mediaStream?.getVideoTracks()[0]?.label||'',microphone_label:mediaStream?.getAudioTracks()[0]?.label||''});
  try{if(useBeacon&&navigator.sendBeacon){navigator.sendBeacon('/api/media/upload?'+q.toString(),blob);return;}const r=await fetch('/api/media/upload?'+q.toString(),{method:'POST',headers:{'Content-Type':mime},body:blob});if(!r.ok)throw new Error(await r.text());const out=await r.json();setMediaStatus(`Saved segment ${mediaSegment}: video + separate audio`);}catch(e){setMediaStatus('Upload failed: '+e.message);await postMediaEvent('error','Upload failed: '+e.message);}
}
function phaseTitle(s){return s.phase_label||s.phase||'Waiting';}
function duration(){return state?.phase_duration_sec??null;}
function remaining(){const d=duration();if(d==null)return null;const elapsed=Math.max(0,Math.floor((Date.now()-phaseStartedAt)/1000));return Math.max(0,d-elapsed);}
function timerHtml(){const r=remaining();if(r==null)return'';const cls=r===0?'expired':r<=3?'warn':'';return`<div class="timer ${cls}" id="timerText">00:${String(r).padStart(2,'0')}</div><div class="footer" id="timerNote">${r===0?'Time expired. Waiting for moderator.':'Timer is informational. Please wait for the moderator.'}</div>`;}
function header(tag){return`<div class="phaseTag">${tag}</div>`;}
function setPanelClass(cls=''){document.getElementById('panel').className='panel '+cls;}
function welcome(){setPanelClass('');const mediaButtons=playerId===1?`<button class="submit" style="font-size:18px;padding:12px 22px;background:#198754" onclick="setupMedia()">Set Up P1 Camera + Mic</button>`:`<span class="footer">Camera/microphone simulation mode for this station.</span>`;return`<h1 class="studyTitle">Human Decision-Making Study</h1><div class="lab">Neuro Interaction Innovation Laboratory · Center for Cyber Physical Realms · Kennesaw State University</div>${header('Waiting for Session Start')}<div class="mainText">Welcome</div><p class="subText">This workstation is prepared for today's study session.</p><div style="display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:22px;"><button class="submit" style="font-size:18px;padding:12px 22px;background:#344054" onclick="enableAudioCue()">Enable Sound</button><button class="submit" style="font-size:18px;padding:12px 22px;background:#0b5cab" onclick="testBeep()">Test Long Beep</button>${mediaButtons}</div><div class="footer">Sound: <b>${audioStatus}</b>. The long tone marks each speaking boundary.</div>`;}
async function getWord(){const a=await api(`/api/assignment?session_id=${encodeURIComponent(sessionId)}&game_number=${state.game_number}&player_id=${playerId}`);return a.word;}
function playerOptions(name){let html='<div class="choices">';for(let i=1;i<=5;i++)html+=`<label class="choice"><input type="radio" name="${name}" value="${i}">P${i}</label>`;return html+'</div>';}
function confidenceOptions(){let html='<div class="choices">';for(let i=1;i<=5;i++)html+=`<label class="choice"><input type="radio" name="confidence" value="${i}">${i}</label>`;return html+'</div>';}
async function submitVote(){const x=document.querySelector('input[name="vote"]:checked');if(!x)return alert('Please select a participant.');await api('/api/responses/vote',{method:'POST',body:JSON.stringify({session_id:sessionId,game_number:state.game_number,round_number:state.round_number,player_id:playerId,vote_target:parseInt(x.value,10)})});submittedKey=`${state.phase}-${state.game_number}-${state.round_number}`;renderSubmitted('Decision submitted.');}
async function submitConfidence(){const x=document.querySelector('input[name="confidence"]:checked');if(!x)return alert('Please select a confidence rating.');await api('/api/responses/confidence',{method:'POST',body:JSON.stringify({session_id:sessionId,game_number:state.game_number,round_number:state.round_number,player_id:playerId,confidence:parseInt(x.value,10)})});submittedKey=`${state.phase}-${state.game_number}-${state.round_number}`;renderSubmitted('Confidence submitted.');}
async function submitReasoning(){const reasons=[...document.querySelectorAll('input[name="reason"]:checked')].map(x=>x.value);await api('/api/responses/reasoning',{method:'POST',body:JSON.stringify({session_id:sessionId,game_number:state.game_number,round_number:state.round_number,player_id:playerId,reasons})});submittedKey=`${state.phase}-${state.game_number}-${state.round_number}`;renderSubmitted('Reasoning submitted.');}
function renderSubmitted(msg){content.innerHTML=`${header(phaseTitle(state))}<div class="submitted">${msg}</div><p class="subText">Please wait for the moderator.</p>`;}
async function handleMediaPhaseChange(oldPhase,newPhase){if(playerId!==1)return;if(newPhase==='SESSION_START'&&mediaReady&&!mediaRecording)await startMediaRecording();if(newPhase==='SESSION_END'&&mediaRecording)await stopMediaRecording();}
async function render(force=false){if(!state)return;sessionId=state.session_id;const key=`${state.phase}-${state.game_number}-${state.round_number}-${state.active_speaker||''}`;const changed=key!==lastKey;if(changed){const old=previousPhase;phaseStartedAt=new Date(state.updated_at+'Z').getTime()||Date.now();lastKey=key;previousPhase=state.phase;maybeBeepForBoundary(true);await handleMediaPhaseChange(old,state.phase);}if(!force&&!changed&&['VOTE_PHASE','CONFIDENCE_PHASE','REASONING_PHASE'].includes(state.phase))return;const currentSubmitKey=`${state.phase}-${state.game_number}-${state.round_number}`;if(submittedKey===currentSubmitKey)return;if(state.phase==='WAITING'||state.phase==='SESSION_START'){content.innerHTML=welcome();return;}if(state.phase==='GAME_READY'){setPanelClass('');content.innerHTML=`${header('Game Ready')}<div class="mainText">Please wait</div>`;return;}if(state.phase==='WORD_PHASE'){setPanelClass('');try{const word=await getWord();content.innerHTML=`${header('Private Word')}<div class="mainText">Your word is</div><div class="word">${word}</div>${timerHtml()}<p class="subText">Please keep this word private.</p>`;}catch(e){content.innerHTML=`${header('Waiting')}<div class="mainText">Word assignment pending</div>`;}return;}if(state.phase.startsWith('SPEAKER_P')){const active=state.active_speaker;if(active===playerId){setPanelClass('speaking');content.innerHTML=`${header('Your Turn')}<div class="mainText">Please speak now</div>${timerHtml()}<p class="subText">Begin after the long tone.</p>`;}else{setPanelClass('');content.innerHTML=`${header('Listening')}<div class="mainText">Participant ${active} is speaking</div>${timerHtml()}`;}return;}if(state.phase==='VOTE_PHASE'){setPanelClass('decision');content.innerHTML=`${header('Decision Phase')}<div class="mainText">Who received different information?</div>${timerHtml()}${playerOptions('vote')}<button class="submit" onclick="submitVote()">Submit Decision</button>`;return;}if(state.phase==='CONFIDENCE_PHASE'){setPanelClass('decision');content.innerHTML=`${header('Confidence Rating')}<div class="mainText">How confident are you?</div>${timerHtml()}${confidenceOptions()}<button class="submit" onclick="submitConfidence()">Submit Confidence</button>`;return;}if(state.phase==='REASONING_PHASE'){setPanelClass('decision');content.innerHTML=`${header('Reasoning')}<div class="mainText">What influenced your decision?</div>${timerHtml()}<div class="checklist"><label class="checkItem"><input type="checkbox" name="reason" value="vague_speech"> Vague speech</label><label class="checkItem"><input type="checkbox" name="reason" value="hesitation"> Hesitation</label><label class="checkItem"><input type="checkbox" name="reason" value="contradiction"> Contradiction</label><label class="checkItem"><input type="checkbox" name="reason" value="too_much_detail"> Too much detail</label><label class="checkItem"><input type="checkbox" name="reason" value="seemed_nervous"> Seemed nervous</label><label class="checkItem"><input type="checkbox" name="reason" value="guess"> Guess</label></div><button class="submit" onclick="submitReasoning()">Submit Reasoning</button>`;return;}if(state.phase==='ROUND_END'){setPanelClass('');content.innerHTML=`${header('Round Complete')}<div class="mainText">Please wait</div>`;return;}if(state.phase==='GAME_END'){setPanelClass('');content.innerHTML=`${header('Game Complete')}<div class="mainText">Please wait</div>`;return;}if(state.phase==='SESSION_END'){setPanelClass('complete');content.innerHTML=`${header('Session Complete')}<div class="mainText">Thank you</div><p class="subText">Media is being saved. Please keep this page open until the status says saved.</p>`;return;}}
function updateTimerText(){const el=document.getElementById('timerText'),r=remaining();if(!el||r==null)return;el.textContent=`00:${String(r).padStart(2,'0')}`;el.className='timer '+(r===0?'expired':r<=3?'warn':'');}
async function refresh(){state=await api('/api/state');await render();}
async function heartbeat(){if(!state)return;try{await api('/api/participants/heartbeat',{method:'POST',body:JSON.stringify({session_id:state.session_id,player_id:playerId,current_phase_seen:state.phase})});}catch(e){}}
window.addEventListener('pagehide',()=>{if(mediaRecorder&&mediaRecording){try{mediaRecorder.requestData();mediaRecorder.stop();setTimeout(()=>{uploadMediaSegment('camera_audio',mediaChunks,mediaMime,true);uploadMediaSegment('audio_only',audioChunks,audioMime,true);},50);}catch(e){}}});
setInterval(async()=>{await refresh();await heartbeat();},750);setInterval(updateTimerText,250);refresh();
</script>
</body>
</html>
