<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARL Observer</title><style>body{font-family:Arial,Helvetica,sans-serif;background:#eef3f8;color:#101828;margin:0}header{background:#0b1f3a;color:white;padding:24px 34px}h1{margin:0;font-size:34px}.wrap{max-width:1200px;margin:24px auto;padding:0 18px}.card{background:white;border:1px solid #d6dee8;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 4px 14px rgba(16,24,40,.06)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.label{font-size:13px;color:#667085;text-transform:uppercase;letter-spacing:.08em}.big{font-size:38px;font-weight:900;margin-top:8px}.clock{font-size:42px;font-weight:900;color:#198754}.pill{display:inline-block;padding:9px 13px;border-radius:999px;margin:4px;font-weight:800}.ok{background:#d1fadf;color:#05603a}.bad{background:#fee4e2;color:#b42318}.wait{background:#eef2ff;color:#344054}.warn{background:#fff4cc;color:#8a5a00}.marker{font-family:Consolas,monospace;background:#0b1220;color:#d7e4f5;border-radius:10px;padding:10px;margin:6px 0;font-size:13px}</style></head><body><header><h1>ARL Study Observer</h1><p>Read-only acquisition monitor</p></header><div class="wrap"><section class="card grid"><div><div class="label">Current Phase</div><div class="big" id="phase">Loading...</div></div><div><div class="label">Game / Round</div><div class="big" id="gr">--</div></div><div><div class="label">Game Timer</div><div class="clock" id="gameTimer">--:--</div></div><div><div class="label">Session Timer</div><div class="clock" id="sessionTimer">--:--</div></div></section><section class="card"><h2>Participant Devices</h2><div id="participants"></div></section><section class="card"><h2>Response Status</h2><div id="responses"></div></section><section class="card"><h2>XDF / LSL Readiness</h2><div id="xdf"></div></section><section class="card"><h2>Last Markers</h2><div id="markers"></div></section></div><script>let state=null;async function api(p){const r=await fetch(p);return await r.json()}function fmt(sec){if(sec==null)return'--:--';sec=Math.max(0,Math.floor(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}async function refresh(){state=await api('/api/state');phase.textContent=state.phase_label;gr.textContent=`Game ${state.game_number} / Round ${state.round_number}`;let t=await api(`/api/status/timers?session_id=${state.session_id}`);gameTimer.textContent=fmt(t.game_elapsed_sec);sessionTimer.textContent=fmt(t.session_elapsed_sec);let p=await api(`/api/status/participants?session_id=${state.session_id}`);participants.innerHTML=Object.entries(p.status).map(([i,s])=>`<span class="pill ${s.connected?'ok':'bad'}">P${i}: ${s.connected?'Connected':'Disconnected'} ${s.age_sec!=null?`(${s.age_sec}s)`:''}</span>`).join('');let rr=await api(`/api/status/responses?session_id=${state.session_id}&game_number=${state.game_number}&round_number=${state.round_number}`);responses.innerHTML=Object.entries(rr.status).map(([i,s])=>`<span class="pill ${s.vote?'ok':'wait'}">P${i} vote ${s.vote?'✓':'—'}</span><span class="pill ${s.confidence?'ok':'wait'}">conf ${s.confidence?'✓':'—'}</span><span class="pill ${s.reasoning?'ok':'wait'}">reason ${s.reasoning?'✓':'—'}</span>`).join('<br>');let x=await api(`/api/status/xdf?session_id=${state.session_id}`);xdf.innerHTML=`<span class="pill ${x.lsl_available?'ok':'bad'}">LSL ${x.lsl_available?'✓':'missing'}</span><span class="pill ${x.labrecorder_checked?'ok':'bad'}">LabRecorder QC ${x.labrecorder_checked?'✓':'missing'}</span><span class="pill ${x.xdf_ready?'ok':'bad'}">XDF ready ${x.xdf_ready?'✓':'no'}</span>`;let m=await api(`/api/status/markers?session_id=${state.session_id}&limit=10`);markers.innerHTML=m.markers.reverse().map(a=>`<div class="marker">${a.server_time_utc} · ${a.marker} ${a.value?('· '+a.value):''}</div>`).join('')||'No markers yet.'}setInterval(refresh,1500);refresh();</script></body></html>
